spring.application.name=recetario-secure-api

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:recetariodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# JWT: el secreto debe tener 32+ caracteres. En Docker se sobreescribe con la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-cambiala-en-produccion-123456}
app.jwt.expiration-ms=3600000

# Usuario de demostración (en un proyecto real vendría de la base de datos)
app.auth.username=admin
app.auth.password=admin123

# CORS: orígenes del frontend permitidos, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5500,http://127.0.0.1:5500}
